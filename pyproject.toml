[project]
name = "aiip-kit"
version = "0.1.0"
description = "Общий код сервисов AIIP: сообщения, outbox и inbox, проверка прав, служебные токены"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.2.1",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.32.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiip_kit"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
include = ["aiip_kit/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.14"
files = ["aiip_kit", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
